<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web3 Ambient Architectures</title>
    
    <meta name="title" content="Web3 Ambient Architectures">
    <meta name="description" content="An immersive 3D visualization of decentralized networks. Track the data streams using your touch or AI hand-tracking.">

    <style>
        body { margin: 0; overflow: hidden; background-color: #010102; font-family: monospace; color: #8a8a9a; user-select: none; touch-action: none; }
        canvas { display: block; outline: none; }
        #webcamVideo { display: none; }
        
        #ui-panel {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(5, 5, 10, 0.7);
            border: 1px solid #2a2a3a; border-radius: 8px;
            padding: 15px; font-size: 12px; line-height: 1.6;
            backdrop-filter: blur(8px); box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            min-width: 280px; display: none;
        }
        
        .tab-row { display: flex; gap: 8px; margin-bottom: 12px; border-bottom: 1px solid #2a2a3a; padding-bottom: 10px; }
        .tab-row.no-border { border-bottom: none; margin-bottom: 0; }
        .tab-btn {
            background: transparent; border: 1px solid #2a2a3a; color: #6a6a7a;
            padding: 8px 10px; border-radius: 4px; cursor: pointer; font-family: monospace;
            transition: all 0.3s ease; flex-grow: 1; text-align: center;
        }
        .tab-btn:hover { background: rgba(60, 60, 80, 0.3); color: #8a8a9a; }
        .tab-btn.active { border-color: #00cccc; color: #fff; background: rgba(0, 204, 204, 0.1); box-shadow: 0 0 10px rgba(0,204,204,0.2); }

        .highlight { color: #00cccc; text-shadow: 0 0 5px rgba(0,204,204,0.3); }
        .pink { color: #6a6a7a; }
        
        #loading-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 18px; color: #00cccc; text-shadow: 0 0 10px rgba(0,204,204,0.5); z-index: 20;
            animation: pulse 1.5s infinite; text-align: center; width: 100%;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* Mobile Responsive adjustments */
        @media (max-width: 600px) {
            #ui-panel { top: 10px; left: 10px; right: 10px; min-width: auto; padding: 10px; font-size: 11px; }
            .tab-btn { padding: 6px 5px; font-size: 10px; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <div id="loading-overlay">Syncing Ambient Architectures...</div>

    <div id="ui-panel">
        <div class="tab-row" id="network-tabs">
            <button class="tab-btn active" onclick="switchNetwork('startale')">STARTALE</button>
            <button class="tab-btn" onclick="switchNetwork('soneium')">SONEIUM</button>
            <button class="tab-btn" onclick="switchNetwork('astar')">ASTAR</button>
        </div>
        <div class="tab-row no-border" id="input-tabs">
            <button class="tab-btn active" id="btn-camera" onclick="switchInput('camera')">📷 CAMERA</button>
            <button class="tab-btn" id="btn-mouse" onclick="switchInput('mouse')">👆 TOUCH/MOUSE</button>
        </div>
        <hr style="border-color: #2a2a3a; margin: 8px 0;">
        
        <div><span class="pink">const</span> state = {</div>
        <div>&nbsp;&nbsp;node: <span class="highlight" id="active-node-text">'startale'</span>,</div>
        <div>&nbsp;&nbsp;engine: <span class="highlight">'ambient_bloom'</span></div>
        <div>};</div>
        <div style="margin-top: 8px;">STATUS: <span class="highlight" id="gesture-status">Searching...</span></div>
    </div>

    <video id="webcamVideo" autoplay playsinline webkit-playsinline></video>

    <script>
        // --- 1. DOM Elements ---
        const uiElements = {
            overlay: document.getElementById('loading-overlay'),
            panel: document.getElementById('ui-panel'),
            status: document.getElementById('gesture-status'),
            nodeText: document.getElementById('active-node-text'),
            video: document.getElementById('webcamVideo')
        };

        // --- 2. Three.js & Post-Processing Setup ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x010102, 0.004); 
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 140; 
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // CRITICAL FOR MOBILE GPU
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x010102, 1); 
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.3));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(2, 2, 2);
        scene.add(dirLight);

        const renderScene = new THREE.RenderPass(scene, camera);
        // Slightly reduced bloom radius for mobile perf
        const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.7, 0.25, 0.25);
        
        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- 3. Network State ---
        const networks = { startale: null, soneium: null, astar: null };
        let activeNetworkKey = 'startale';
        const dummy = new THREE.Object3D();
        const color = new THREE.Color();

        // --- 4. Image Processing Engine ---
        function buildNetwork(imageSrc, isColorExtracted, bgType = 'dark') {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.src = imageSrc; 
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const size = 140;
                    canvas.width = size; canvas.height = size;
                    ctx.drawImage(img, 0, 0, size, size);
                    const imgData = ctx.getImageData(0, 0, size, size).data;

                    const instancingData = [], particlesData = [], originalMatrices = [];
                    const targetColors = [], lineIndices = [];
                    const gridMap = new Map(); 
                    let nodeIndex = 0;

                    for(let y = 0; y < size; y++) {
                        for(let x = 0; x < size; x++) {
                            const i = (y * size + x) * 4;
                            const [r, g, b] = [imgData[i], imgData[i+1], imgData[i+2]];
                            
                            const isLogoPixel = bgType === 'dark' ? ((r + g + b) / 3) > 20 : (r < 240 || g < 240 || b < 240); 

                            if (isLogoPixel) {
                                const pX = (x - size / 2) * 1.1;
                                const pY = -(y - size / 2) * 1.1;
                                const pZ = (Math.random() - 0.5) * 4; 

                                if (isColorExtracted) {
                                    color.setRGB(r/255, g/255, b/255);
                                } else {
                                    const normX = x / size;
                                    color.setRGB(0.1 + normX * 0.8, 0.9 - normX * 0.5, 1.0);
                                }
                                
                                instancingData.push({ pos: new THREE.Vector3(pX, pY, pZ), color: color.clone() });
                                particlesData.push({ phaseX: Math.random() * Math.PI * 2, phaseY: Math.random() * Math.PI * 2, scale: 0.8 + Math.random() * 0.4 });
                                gridMap.set(`${x},${y}`, nodeIndex++);
                            }
                        }
                    }

                    const count = instancingData.length;
                    const currentPositions = new Float32Array(count * 3);

                    for(let y = 0; y < size; y++) {
                        for(let x = 0; x < size; x++) {
                            const currentIdx = gridMap.get(`${x},${y}`);
                            if (currentIdx !== undefined) {
                                const rightIdx = gridMap.get(`${x+1},${y}`);
                                const bottomIdx = gridMap.get(`${x},${y+1}`);
                                if (rightIdx !== undefined) lineIndices.push(currentIdx, rightIdx);
                                if (bottomIdx !== undefined) lineIndices.push(currentIdx, bottomIdx);
                            }
                        }
                    }

                    const mesh = new THREE.InstancedMesh(
                        new THREE.BoxGeometry(0.7, 0.7, 0.7),
                        new THREE.MeshLambertMaterial({ color: 0xffffff, blending: THREE.AdditiveBlending, transparent: true, opacity: 0.85 }),
                        count
                    );
                    
                    for (let i = 0; i < count; i++) {
                        dummy.position.copy(instancingData[i].pos);
                        dummy.updateMatrix();
                        mesh.setMatrixAt(i, dummy.matrix);
                        originalMatrices.push(dummy.matrix.clone());
                        mesh.setColorAt(i, instancingData[i].color);
                        targetColors.push(instancingData[i].color.clone());
                    }

                    const lineGeo = new THREE.BufferGeometry();
                    lineGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(lineIndices.length * 3), 3));
                    const lines = new THREE.LineSegments(
                        lineGeo,
                        new THREE.LineBasicMaterial({ color: isColorExtracted ? 0xaa66dd : 0x00cccc, transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending, depthWrite: false })
                    );
                    
                    const group = new THREE.Group();
                    group.add(mesh); group.add(lines);
                    group.visible = false; 
                    scene.add(group);

                    resolve({ group, mesh, lines, particlesData, originalMatrices, targetColors, lineIndices, currentPositions, count });
                };
                img.onerror = reject;
            });
        }

        // --- 5. Initialization ---
        Promise.all([
            buildNetwork('startale.jpg', false, 'dark'), 
            buildNetwork('soneium.jpg', true, 'dark'),    
            buildNetwork('astar.jpg', true, 'dark')
        ]).then((results) => {
            networks.startale = results[0]; 
            networks.soneium = results[1]; 
            networks.astar = results[2];
            
            uiElements.overlay.style.display = 'none';
            uiElements.panel.style.display = 'block';
            networks.startale.group.visible = true;
            
            camera_mp.start();
            animate();
        }).catch(err => {
            uiElements.overlay.innerText = "Error loading image assets.";
            console.error("Asset load failed:", err);
        });

        // --- 6. Input & Interactions ---
        let inputMode = 'camera', targetPinchMultiplier = 1.0;
        const handPos = { x: 0, y: 0, active: false };
        const mousePos = { active: false };
        const mouseNDC = new THREE.Vector2(); 
        const mouseWorldPos = new THREE.Vector3();
        const raycaster = new THREE.Raycaster();
        const zeroPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0); 

        // UI Controllers
        window.switchNetwork = (networkName) => {
            document.querySelectorAll('#network-tabs .tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            uiElements.nodeText.innerText = `'${networkName}'`;

            if (activeNetworkKey !== networkName) {
                networks[activeNetworkKey].group.visible = false;
                activeNetworkKey = networkName;
                networks[activeNetworkKey].group.visible = true;
            }
        };

        window.switchInput = (mode) => {
            inputMode = mode;
            document.querySelectorAll('#input-tabs .tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');
            targetPinchMultiplier = 1.0; handPos.active = false; mousePos.active = false;
            uiElements.status.innerText = mode === 'camera' ? "Searching..." : "Ready";
        };

        // MediaPipe Integration
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults((results) => {
            if(inputMode !== 'camera') return; 
            if (results.multiHandLandmarks?.length > 0) {
                handPos.active = true;
                const lm = results.multiHandLandmarks[0];
                handPos.x = (lm[8].x - 0.5) * targetPinchMultiplier * 140; 
                handPos.y = -(lm[8].y - 0.5) * targetPinchMultiplier * 140;

                const dx = lm[8].x - lm[4].x, dy = lm[8].y - lm[4].y;
                targetPinchMultiplier = 1.0 + (Math.sqrt(dx*dx + dy*dy) * 14);
                uiElements.status.innerText = targetPinchMultiplier > 1.8 ? "Elastic Stretch" : "Tracking Hand";
            } else {
                handPos.active = false; targetPinchMultiplier = 1.0; 
                uiElements.status.innerText = "Camera Active (No Hand)";
            }
        });
        const camera_mp = new Camera(uiElements.video, { onFrame: async () => { await hands.send({image: uiElements.video}); }, width: 640, height: 480 });

        // Mouse Events (Desktop)
        window.addEventListener('mousemove', (e) => {
            if(inputMode !== 'mouse') return;
            mousePos.active = true;
            mouseNDC.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
            raycaster.setFromCamera(mouseNDC, camera);
            raycaster.ray.intersectPlane(zeroPlane, mouseWorldPos);
        });
        window.addEventListener('mousedown', () => { if(inputMode === 'mouse') { targetPinchMultiplier = 2.5; uiElements.status.innerText = "Magnetic Burst"; }});
        window.addEventListener('mouseup', () => { if(inputMode === 'mouse') { targetPinchMultiplier = 1.0; uiElements.status.innerText = "Magnetic Hover"; }});
        window.addEventListener('mouseleave', () => { if(inputMode === 'mouse') { mousePos.active = false; targetPinchMultiplier = 1.0; uiElements.status.innerText = "Standby"; }});

        // Touch Events (Mobile Support)
        const handleTouchMove = (e) => {
            if(inputMode !== 'mouse' || e.touches.length === 0) return;
            mousePos.active = true;
            mouseNDC.set((e.touches[0].clientX / window.innerWidth) * 2 - 1, -(e.touches[0].clientY / window.innerHeight) * 2 + 1);
            raycaster.setFromCamera(mouseNDC, camera);
            raycaster.ray.intersectPlane(zeroPlane, mouseWorldPos);
        };
        window.addEventListener('touchstart', (e) => { if(inputMode === 'mouse') { targetPinchMultiplier = 2.5; uiElements.status.innerText = "Magnetic Burst"; handleTouchMove(e); }});
        window.addEventListener('touchmove', handleTouchMove);
        window.addEventListener('touchend', () => { if(inputMode === 'mouse') { targetPinchMultiplier = 1.0; mousePos.active = false; uiElements.status.innerText = "Standby"; }});


        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 7. Animation Loop ---
        let time = 0, pinchMultiplier = 1.0;
        const tempPos = new THREE.Vector3();
        const REPEL_RADIUS = 10, REPEL_STRENGTH = 35; 

        function animate() {
            requestAnimationFrame(animate);
            time += 0.015;

            const net = networks[activeNetworkKey];
            if (!net) return;

            // Camera follow logic
            const camTargetX = (inputMode === 'mouse' && mousePos.active) ? mouseNDC.x * 20 : 0;
            const camTargetY = (inputMode === 'mouse' && mousePos.active) ? mouseNDC.y * 20 : 0;
            camera.position.x += (camTargetX - camera.position.x) * 0.05;
            camera.position.y += (camTargetY - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            net.group.rotation.set(Math.cos(time * 0.15) * 0.1, Math.sin(time * 0.3) * 0.2, 0);
            net.lines.material.opacity = 0.15 + (Math.sin(time * 4) * 0.1); 
            pinchMultiplier += (targetPinchMultiplier - pinchMultiplier) * 0.1;

            for (let i = 0; i < net.count; i++) {
                const pData = net.particlesData[i];
                tempPos.setFromMatrixPosition(net.originalMatrices[i]).multiplyScalar(pinchMultiplier);

                let isHovered = false;
                if (inputMode === 'mouse' && mousePos.active) {
                    const dx = tempPos.x - mouseWorldPos.x, dy = tempPos.y - mouseWorldPos.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);

                    if (dist < REPEL_RADIUS) {
                        isHovered = true;
                        const force = Math.pow((REPEL_RADIUS - dist) / REPEL_RADIUS, 1.5); 
                        tempPos.x += (dx / dist) * force * REPEL_STRENGTH;
                        tempPos.y += (dy / dist) * force * REPEL_STRENGTH;
                        tempPos.z += force * 10; 
                    }
                }

                tempPos.x += Math.sin(time * 2 + pData.phaseX) * 0.5 * pinchMultiplier;
                tempPos.y += Math.cos(time * 2 + pData.phaseY) * 0.5 * pinchMultiplier;

                dummy.position.copy(tempPos);
                dummy.scale.setScalar(pData.scale);
                dummy.updateMatrix();

                net.mesh.setMatrixAt(i, dummy.matrix);
                net.currentPositions[i*3] = tempPos.x;
                net.currentPositions[i*3+1] = tempPos.y;
                net.currentPositions[i*3+2] = tempPos.z;

                if(isHovered) {
                    color.copy(net.targetColors[i]).multiplyScalar(1.15); 
                    net.mesh.setColorAt(i, color);
                } else {
                    net.mesh.setColorAt(i, net.targetColors[i]); 
                }
            }

            net.mesh.instanceMatrix.needsUpdate = true;
            net.mesh.instanceColor.needsUpdate = true; 

            const linePositions = net.lines.geometry.attributes.position.array;
            for(let c = 0; c < net.lineIndices.length; c++) {
                const nodeIdx = net.lineIndices[c]; 
                linePositions[c*3]     = net.currentPositions[nodeIdx*3];    
                linePositions[c*3 + 1] = net.currentPositions[nodeIdx*3 + 1]; 
                linePositions[c*3 + 2] = net.currentPositions[nodeIdx*3 + 2]; 
            }
            net.lines.geometry.attributes.position.needsUpdate = true;

            composer.render();
        }
    </script>
</body>
</html>
